[project]
name = "stroke_host"
version = "0.1.0a1"
description = "StrokeGuard host-side pipeline (M1a: CDC ingest + sim source + AES-GCM recorder)"
requires-python = ">=3.10"
authors = [{ name = "StrokeGuard Team" }]
dependencies = [
    "pyserial>=3.5",
    "opencv-python>=4.8",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "cryptography>=41",
    "keyring>=24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]
perception = [
    "mediapipe>=0.10",
]
ui = [
    "PyQt5>=5.15",
    "pyttsx3>=2.90",
]

[project.scripts]
stroke-host = "stroke_host.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stroke_host*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
