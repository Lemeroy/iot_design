schema_version: 1

device:
  id: sg-0001
  management_token: ${STROKEGUARD_MANAGER_TOKEN}

wifi:
  ssid: ${STROKEGUARD_WIFI_SSID}
  password: ${STROKEGUARD_WIFI_PASSWORD}

mqtt:
  uri: mqtt://106.75.229.61:1883
  username: ${STROKEGUARD_MQTT_USERNAME}
  password: ${STROKEGUARD_MQTT_PASSWORD}

hardware:
  camera:
    model: ESP32-S3-Cam
    enabled: true
    transport: i2c
    address: 66
    pins:
      sda: 8
      scl: 9
  microphone:
    model: NMO432
    enabled: true
    sample_rate: 16000
    channel: left
    pins:
      sck: 17
      ws: 18
      sd: 16
